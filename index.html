</style></head><body><div id="root"></div><script>
const root=document.getElementById('root');let page='landing',category='All',search='';const categories=[['All','🍽️'],['Burgers','🍔'],['Pizza','🍕'],['Chicken','🍗'],['Pasta','🍝'],['Drinks','🥤'],['Desserts','🍰']];const foods=[['Crispy Chicken Burger','Burgers','Crispy chicken, fresh lettuce, house sauce','₱149','4.9','15–20 min','https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800&q=85','BEST SELLER'],['Classic Pepperoni Pizza','Pizza','Mozzarella, pepperoni, rich tomato sauce','₱289','4.8','20–25 min','https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=800&q=85','POPULAR'],['Golden Fried Chicken','Chicken','Juicy chicken with crispy coating','₱179','4.9','18–25 min','https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=800&q=85',"CHEF'S PICK"],['Creamy Carbonara','Pasta','Creamy sauce, parmesan, fresh herbs','₱199','4.7','15–20 min','https://images.unsplash.com/photo-1612874742237-6526221588e3?auto=format&fit=crop&w=800&q=85','NEW']];function brand(){return `<a class="brand"><span class="mark">🍴</span><span>quick<span class="orange">bite</span><small>GOOD FOOD. GOOD MOOD.</small></span></a>`}function go(p){page=p;render()}function render(){if(page==='landing'){root.innerHTML=`<div class="announcement"><i></i> Freshly prepared meals, delivered to your door. <a onclick="go('register')">Explore menu ↗</a></div><header class="landing-header">${brand()}<nav class="nav" id="nav"><a>Home</a><a onclick="go('register')">Categories</a><a onclick="go('register')">Our menu</a><a href="#why">Why QuickBite</a></nav><div class="head-actions"><button class="btn ghost" onclick="go('login')">Log in</button><button class="btn primary" onclick="go('register')">Get started ↗</button></div></header><main><section class="hero wrap"><div><div class="eyebrow">🔥 YOUR CRAVINGS, OUR PRIORITY</div><h1>Good food.<br><span>Great mood.</span><br>Delivered.</h1><p>From your favorite comfort food to exciting new flavors — get the meals you love, made fresh and delivered with care.</p><div class="hero-actions"><button class="btn primary" onclick="go('register')">Get started →</button><button class="btn outline" onclick="go('register')">Browse menu</button></div></div><div class="hero-art"><div class="float one">🚴 Quick delivery<br><small>At your doorstep</small></div><img src="https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=1200&q=90" alt="Burger"><div class="float two">🥬 Fresh ingredients</div></div></section><section class="benefits"><div>🚴 Quick delivery<small>Fast and reliable</small></div><div>👨‍🍳 Freshly prepared<small>Quality in every bite</small></div><div>🛡️ Secure ordering<small>Your details stay safe</small></div><div>💗 Made for you<small>Food worth sharing</small></div></section><section class="wrap landing-more"><div class="eyebrow">WHAT ARE YOU CRAVING?</div><h2 class="section-title">Explore our <span>categories</span></h2><div class="cat-grid">${categories.slice(1,5).map(c=>`<button class="cat" onclick="go('register')"><span>${c[1]}</span><b>${c[0]}</b><small>Explore meals</small></button>`).join('')}</div></section><section class="wrap why" id="why"><img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=1000&q=85"><div><div class="eyebrow">A LITTLE MORE THAN JUST FOOD</div><h2 class="section-title">Made fresh.<br><span>Delivered happy.</span></h2><p>Great meals bring people together. Every QuickBite order is prepared with care, packed with flavor, and delivered with a smile.</p><button class="btn primary" onclick="go('register')">Join QuickBite →</button></div></section></main><footer class="footer">${brand()}<span>© 2026 QuickBite. Good food, good mood.</span></footer>`}else if(page==='login'||page==='register'){root.innerHTML=`<div class="auth-page"><aside class="auth-side">${brand()}<div class="auth-photo"><img src="https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=1000&q=85"><div class="photo-caption">A good day starts<br>with a <em>good bite.</em></div></div><p>Fresh favorites, easy ordering, happy moments.</p></aside><section class="auth-main"><button class="back" onclick="go('landing')">← Back to home</button><div class="auth-form"><div class="eyebrow">WELCOME TO QUICKBITE</div><h1>${page==='register'?'Create your account':'Welcome back'}</h1><p>${page==='register'?'Sign up to discover delicious meals near you.':'Log in to continue your food ordering experience.'}</p><form onsubmit="event.preventDefault();alert('This is a UI prototype. Account data is not saved or sent to a server.')">${page==='register'?'<label>Full name<input required placeholder="Enter your full name"></label>':''}<label>Email address<input type="email" required placeholder="you@example.com"></label><label>Password<input type="password" required minlength="6" placeholder="Enter your password"></label><button class="btn primary" type="submit">${page==='register'?'Create account':'Log in'} →</button></form><div class="switch">${page==='register'?'Already have an account?':'New to QuickBite?'} <button onclick="go('${page==='register'?'login':'register'}')">${page==='register'?'Log in':'Create account'}</button></div><div class="demo">UI prototype only. No credentials are sent to a server.</div></div></section></div>`}}
render();
</script></body></html>
